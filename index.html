<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Lalo YTD — Sales AI</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080f1a;--surface:#0f1f35;--surface2:#162844;
  --accent:#00d4ff;--accent2:#7c3aed;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;
  --text:#e2e8f0;--muted:#64748b;
  --border:rgba(0,212,255,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

/* NAVBAR */
.navbar{position:sticky;top:0;z-index:100;background:rgba(8,15,26,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.navbar-brand{font-family:'Space Mono',monospace;font-size:14px;color:var(--accent);letter-spacing:2px;}
.navbar-brand span{color:var(--muted);}
.status-area{display:flex;align-items:center;gap:8px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.reload-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 8px;font-size:12px;cursor:pointer;transition:all .2s;}
.reload-btn:hover{border-color:var(--accent);color:var(--accent);}

/* PROGRESS */
#progressOverlay{display:none;position:fixed;top:49px;left:0;right:0;z-index:200;background:rgba(8,15,26,0.98);padding:20px 16px;border-bottom:1px solid rgba(0,212,255,.2);}
.progress-header{display:flex;justify-content:space-between;margin-bottom:8px;}
.progress-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:1px;}
.progress-pct{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);font-weight:700;}
.progress-track{background:var(--surface2);border-radius:4px;height:6px;overflow:hidden;margin-bottom:10px;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#7c3aed);border-radius:4px;transition:width .4s ease;}
.progress-msg{font-size:12px;color:var(--muted);margin-bottom:8px;}
.progress-steps{display:flex;flex-direction:column;gap:3px;max-height:120px;overflow-y:auto;}
.progress-step{font-size:11px;font-family:'Space Mono',monospace;}

/* TABS */
.tabs{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--border);background:rgba(8,15,26,.8);position:sticky;top:49px;z-index:90;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 14px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.tab.active{background:rgba(0,212,255,.1);border-color:var(--accent);color:var(--accent);}

/* PAGES */
.page{display:none;padding:16px;position:relative;z-index:1;}
.page.active{display:block;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.card-title{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 12px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:6px;}
.stat-value{font-family:'Space Mono',monospace;font-size:18px;color:var(--accent);font-weight:700;line-height:1;}
.stat-value.green{color:var(--green);}
.stat-value.yellow{color:var(--yellow);}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* SHIMMER */
.shimmer{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;height:24px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* LIST */
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.list-item:last-child{border-bottom:none;}
.list-rank{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);width:24px;flex-shrink:0;}
.list-rank.gold{color:#f59e0b;}.list-rank.silver{color:#94a3b8;}.list-rank.bronze{color:#b45309;}
.list-name{flex:1;font-size:13px;font-weight:500;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-val{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);text-align:right;flex-shrink:0;}
.list-val .sub{display:block;font-size:10px;color:var(--muted);}

/* MONTH SELECTOR */
.month-sel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.month-sel::-webkit-scrollbar{display:none;}
.month-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all .2s;}
.month-btn.active{background:rgba(0,212,255,.1);border-color:var(--accent);color:var(--accent);}

/* PROGRESS BAR IN CARD */
.prog-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 180px);}
.chat-msgs{flex:1;overflow-y:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent;}
.quick-qs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.quick-q{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
.quick-q:hover{border-color:var(--accent);color:var(--accent);}
.msg{margin-bottom:12px;display:flex;flex-direction:column;}
.msg.user{align-items:flex-end;}.msg.ai{align-items:flex-start;}
.msg-lbl{font-size:10px;color:var(--muted);margin-bottom:4px;font-family:'Space Mono',monospace;letter-spacing:1px;}
.msg-bubble{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;}
.msg.user .msg-bubble{background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);border-bottom-right-radius:4px;}
.msg.ai .msg-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;}
.typing{display:flex;gap:4px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;border-bottom-left-radius:4px;width:fit-content;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:typing 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}
.chat-input-row{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);}
.chat-inp{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;height:44px;-webkit-appearance:none;}
.chat-inp:focus{border-color:var(--accent);}
.send-btn{background:var(--accent);color:var(--bg);border:none;border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0;}

/* WELCOME */
.welcome-card{background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(124,58,237,.08));border:1px solid rgba(0,212,255,.2);border-radius:12px;padding:16px;margin-bottom:14px;}
.welcome-title{font-family:'Space Mono',monospace;font-size:15px;color:var(--accent);margin-bottom:4px;}
.welcome-sub{font-size:12px;color:var(--muted);line-height:1.5;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:12px;z-index:999;transition:transform .3s ease;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* SEARCH */
.search-inp{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;}
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">LALO<span>·</span>YTD</div>
  <div class="status-area">
    <span id="loadStatus" style="font-size:11px;color:var(--muted)">Memuat...</span>

<!-- PROGRESS OVERLAY -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const FB_CONFIG = {
  apiKey:"AIzaSyBwK90APc4xFmX7sOS8WoLyRDjIVThimqQ",
  authDomain:"lalo-ytd.firebaseapp.com",
  projectId:"lalo-ytd",
  storageBucket:"lalo-ytd.firebasestorage.app",
  messagingSenderId:"842696950491",
  appId:"1:842696950491:web:fd500db5cc5d2ed85182fe"
};
const GROQ_KEY = "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";
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const BULAN = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const CACHE_KEY = 'lalo_ytd_v3';
const CACHE_TTL = 30 * 60 * 1000;

const app = initializeApp(FB_CONFIG);
const db = getFirestore(app);

// Global state
window.SD = {}; // salesData
window.PD = {}; // produkData
window.YM = {}; // yearMeta
window.AM = []; // allMonths
window.SM = null; // selectedMonth
window.CH = []; // chatHistory

// ===== PROGRESS =====
function prog(pct, msg, step, status) {
  const fill = document.getElementById('progFill');
  const pctEl = document.getElementById('progPct');
  const msgEl = document.getElementById('progMsg');
  const stepsEl = document.getElementById('progSteps');
  if (fill) fill.style.width = pct + '%';
  if (pctEl) pctEl.textContent = Math.round(pct) + '%';
  if (msgEl) msgEl.textContent = msg || '';
  if (step && stepsEl) {
    const icon = status === 'ok' ? '✅' : status === 'err' ? '❌' : '⏳';
    const color = status === 'ok' ? '#10b981' : status === 'err' ? '#ef4444' : '#f59e0b';
    const d = document.createElement('div');
    d.className = 'progress-step';
    d.style.color = color;
    d.textContent = icon + ' ' + step;
    stepsEl.appendChild(d);
  }
}

function showProg() {
  const el = document.getElementById('progressOverlay');
  if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
  const stepsEl = document.getElementById('progSteps');
  if (stepsEl) stepsEl.innerHTML = '';
  prog(0, 'Menginisialisasi...');
}

function hideProg() {
  const el = document.getElementById('progressOverlay');
  if (!el) return;
  setTimeout(() => {
    el.style.transition = 'opacity 0.6s';
    el.style.opacity = '0';
    setTimeout(() => { el.style.display = 'none'; el.style.transition = ''; }, 600);
  }, 1000);
}

// ===== STATUS =====
function setStatus(txt, color) {
  const s = document.getElementById('loadStatus');
  const d = document.getElementById('statusDot');
  if (s) s.textContent = txt;
  const cols = { green:'#10b981', yellow:'#f59e0b', red:'#ef4444' };
  const c = cols[color] || cols.yellow;
  if (d) { d.style.background = c; d.style.boxShadow = '0 0 8px ' + c; }
}

function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== LOAD DATA =====
async function loadData(forceRefresh) {
  // Try cache first
  if (!forceRefresh) {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        const c = JSON.parse(raw);
        if (Date.now() - c.ts < CACHE_TTL) {
          window.SD = c.SD; window.PD = c.PD; window.YM = c.YM;
          window.AM = Object.keys(c.SD).sort((a,b) => (c.YM[a]?.year||0) - (c.YM[b]?.year||0));
          window.SM = window.AM[window.AM.length - 1];
          setStatus('Online ⚡', 'green');
          updateWelcome();
          renderAll();
          // Refresh in background
          setTimeout(() => loadFromFirebase(true), 500);
          return;
        }
      }
    } catch(e) {}
  }
  showProg();
  await loadFromFirebase(false);
}

async function loadFromFirebase(bg) {
  try {
    if (!bg) { setStatus('Memuat...', 'yellow'); prog(5, 'Menghubungkan ke Firebase...'); }

    const [sdSnap, sbSnap] = await Promise.all([
      getDocs(collection(db, 'sales_data')),
      getDocs(collection(db, 'sales_base'))
    ]);

    if (!bg) prog(20, 'Membaca chunks data...', `${sdSnap.size} periode ditemukan`, 'ok');

    // Parallel chunk reads
    const tasks = [];
    sdSnap.forEach(d => tasks.push(
      getDocs(collection(db, 'sales_data', d.id, 'chunks')).then(s => ({ type:'sd', doc:d, chunks:s }))
    ));
    sbSnap.forEach(d => tasks.push(
      getDocs(collection(db, 'sales_base', d.id, 'chunks')).then(s => ({ type:'sb', doc:d, chunks:s }))
    ));

    if (!bg) prog(35, `Mengambil ${tasks.length} chunk sekaligus...`);
    const results = await Promise.all(tasks);
    const totalChunks = results.reduce((s,r) => s + r.chunks.size, 0);
    if (!bg) prog(60, `Memproses ${totalChunks} dokumen...`, `${totalChunks} chunk berhasil diambil`, 'ok');

    const SD = {}, PD = {}, YM = {};

    let i = 0;
    for (const r of results) {
      i++;
      if (!bg) prog(60 + (i/results.length)*25, `Memproses ${r.doc.id}...`);

      if (r.type === 'sd') {
        const meta = r.doc.data();
        const m25 = (meta._months_25 || []).map(Number);
        const m26 = (meta._months_26 || []).map(Number);
        const oA25={}, oA26={}, pA25={}, pA26={};

        r.chunks.forEach(chunk => {
          const cid = chunk.id;
          const isO = cid.startsWith('o'), isP = cid.startsWith('p');
          const is25 = cid.includes('25');
          const data = chunk.data();

          if (isO) {
            const tgt = is25 ? oA25 : oA26;
            Object.entries(data).forEach(([oName, oData]) => {
              if (oName.startsWith('_') || typeof oData !== 'object' || Array.isArray(oData)) return;
              if (!tgt[oName]) tgt[oName] = {};
              const prods = oData.products || {};
              Object.entries(prods).forEach(([pName, pData]) => {
                if (typeof pData !== 'object') return;
                let qty = parseInt(pData.qty)||0, val = parseInt(pData.val)||0;
                if (val===0 && pData.monthly) {
                  Object.values(pData.monthly).forEach(mv => { if(typeof mv==='object') val += parseInt(mv.val)||0; });
                }
                if (!tgt[oName][pName]) tgt[oName][pName] = {qty:0,val:0};
                tgt[oName][pName].qty += qty;
                tgt[oName][pName].val += val;
              });
              if (!Object.keys(prods).length) {
                const qty=parseInt(oData.qty_total)||0, val=parseInt(oData.val_total)||0;
                if (qty||val) tgt[oName]['_total'] = {qty,val};
              }
            });
          }

          if (isP) {
            const tgt = is25 ? pA25 : pA26;
            Object.entries(data).forEach(([pName, pData]) => {
              if (pName.startsWith('_') || typeof pData !== 'object' || Array.isArray(pData)) return;
              let qty=parseInt(pData.qty)||0, val=parseInt(pData.val)||0;
              if (val===0 && pData.monthly) {
                Object.values(pData.monthly).forEach(mv => { if(typeof mv==='object') val += parseInt(mv.val)||0; });
              }
              if (!tgt[pName]) tgt[pName] = {qty:0,val:0};
              tgt[pName].qty += qty; tgt[pName].val += val;
            });
          }
        });

        if (m25.length && Object.keys(oA25).length) {
          SD['YTD 2025'] = oA25; PD['YTD 2025'] = pA25;
          YM['YTD 2025'] = {months:m25, year:2025};
        }
        if (m26.length && Object.keys(oA26).length) {
          const lbl = 'YTD 2026 s/d ' + (BULAN[m26[m26.length-1]] || m26[m26.length-1]);
          SD[lbl] = oA26; PD[lbl] = pA26;
          YM[lbl] = {months:m26, year:2026};
        }
      }

      if (r.type === 'sb') {
        const yr = parseInt(r.doc.id);
        const lbl = 'YTD ' + yr;
        if (SD[lbl]) continue;
        const oA={}, pA={};
        r.chunks.forEach(chunk => {
          const data = chunk.data();
          Object.entries(data).forEach(([oName, oData]) => {
            if (['months','nchunks','_saved'].includes(oName) || oName.startsWith('_')) return;
            if (typeof oData !== 'object' || Array.isArray(oData)) return;
            if (!oA[oName]) oA[oName] = {};
            Object.entries(oData).forEach(([pName, pData]) => {
              if (typeof pData !== 'object') return;
              const qty=parseInt(pData.qty)||0, val=parseInt(pData.val)||0;
              if (!oA[oName][pName]) oA[oName][pName]={qty:0,val:0};
              oA[oName][pName].qty += qty; oA[oName][pName].val += val;
              if (!pA[pName]) pA[pName]={qty:0,val:0};
              pA[pName].qty += qty; pA[pName].val += val;
            });
          });
        });
        if (Object.keys(oA).length) {
          SD[lbl]=oA; PD[lbl]=pA;
          YM[lbl]={months:(r.doc.data().months||[]).map(Number), year:yr};
        }
      }
    }

    window.SD=SD; window.PD=PD; window.YM=YM;
    window.AM = Object.keys(SD).sort((a,b)=>(YM[a]?.year||0)-(YM[b]?.year||0));

    if (!window.AM.length) {
      setStatus('Tidak ada data','red');
      if (!bg) { prog(100,'Tidak ada data ditemukan','Cek Firebase rules','err'); hideProg(); }
      return;
    }

    window.SM = window.AM[window.AM.length-1];

    if (!bg) {
      const tO = Object.keys(SD[window.SM]||{}).length;
      const tP = Object.keys(PD[window.SM]||{}).length;
      prog(90, 'Menyiapkan dashboard...', `${tO} outlet, ${tP} SKU produk`, 'ok');
    }

    setStatus('Online','green');
    updateWelcome();
    renderAll();

    if (!bg) {
      prog(100, 'Selesai! ✅', 'Data siap digunakan — ' + window.AM.join(', '), 'ok');
      hideProg();
    }

    // Save cache
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({SD,PD,YM,ts:Date.now()}));
    } catch(e) {}

  } catch(err) {
    console.error(err);
    if (!bg) {
      prog(100, 'Error: ' + err.message, err.message, 'err');
      hideProg();
      setStatus('Error','red');
    }
    toast('❌ ' + err.message.slice(0,50));
  }
}

// ===== RENDER =====
function updateWelcome() {
  const tO = Object.keys(window.SD[window.SM]||{}).length;
  const tP = Object.keys(window.PD[window.SM]||{}).length;
  const el = document.getElementById('welcomeSub');
  if (el) el.textContent = window.SM + ': ' + tO + ' outlet aktif, ' + tP + ' SKU produk.';
  const ai = document.getElementById('welcomeAiMsg');
  if (ai) ai.innerHTML = '✅ Data dimuat: <strong>' + window.AM.join(' | ') + '</strong><br>📊 ' + tO + ' outlet, ' + tP + ' SKU. Silakan tanyakan apa saja!';
}

function renderAll() {
  renderMonthSel();
  renderDashboard();
  renderOutlet();
  renderProduk();
}

function renderMonthSel() {
  const el = document.getElementById('monthSel');
  if (!el) return;
  el.innerHTML = window.AM.map(m =>
    '<button class="month-btn' + (m===window.SM?' active':'') + '" onclick="selMonth(\'' + m + '\')">' + m + '</button>'
  ).join('');
}

function renderDashboard() {
  const oData = window.SD[window.SM] || {};
  const pData = window.PD[window.SM] || {};
  const outlets = Object.entries(oData);

  let tQty=0, tVal=0;
  const pMap = {};
  outlets.forEach(([,prods]) => {
    Object.entries(prods).forEach(([p,info]) => {
      tQty += info.qty||0; tVal += info.val||0;
      if (!pMap[p]) pMap[p]={qty:0,val:0};
      pMap[p].qty += info.qty||0; pMap[p].val += info.val||0;
    });
  });

  const finalP = Object.keys(pData).length ? pData : pMap;
  if (Object.keys(pData).length) {
    tVal = Object.values(pData).reduce((s,p)=>s+(p.val||0),0);
    tQty = Object.values(pData).reduce((s,p)=>s+(p.qty||0),0);
  }

  const badge = document.getElementById('selMonthBadge');
  if (badge) badge.textContent = window.SM || '—';

  const sg = document.getElementById('statsGrid');
  if (sg) sg.innerHTML =
    '<div class="stat-card"><div class="stat-label">Total Outlet</div><div class="stat-value">' + outlets.length + '</div><div class="stat-sub">aktif</div></div>' +
    '<div class="stat-card"><div class="stat-label">Total SKU</div><div class="stat-value yellow">' + Object.keys(finalP).length + '</div><div class="stat-sub">produk</div></div>' +
    '<div class="stat-card"><div class="stat-label">Total Qty</div><div class="stat-value green">' + tQty.toLocaleString('id') + '</div><div class="stat-sub">unit</div></div>' +
    '<div class="stat-card"><div class="stat-label">Total Nilai</div><div class="stat-value" style="font-size:14px">' + fmtRp(tVal) + '</div></div>';

  // Top 5 outlet
  const top5O = outlets.map(([n,ps])=>({n,qty:Object.values(ps).reduce((s,p)=>s+(p.qty||0),0),val:Object.values(ps).reduce((s,p)=>s+(p.val||0),0)}))
    .sort((a,b)=>b.val-a.val).slice(0,5);
  const ol = document.getElementById('topOutletList');
  if (ol) ol.innerHTML = top5O.map((o,i)=>
    '<div class="list-item"><div class="list-rank ' + rnkClass(i) + '">#'+(i+1)+'</div><div class="list-name">'+o.n+'</div><div class="list-val">'+fmtRp(o.val)+'<span class="sub">'+o.qty+' unit</span></div></div>'
  ).join('');

  // Top 5 produk
  const top5P = Object.entries(finalP).sort((a,b)=>b[1].val-a[1].val).slice(0,5);
  const pl = document.getElementById('topProdukList');
  if (pl) pl.innerHTML = top5P.map(([n,v],i)=>
    '<div class="list-item"><div class="list-rank ' + rnkClass(i) + '">#'+(i+1)+'</div><div class="list-name">'+n+'</div><div class="list-val">'+fmtRp(v.val)+'<span class="sub">'+v.qty+' unit</span></div></div>'
  ).join('');
}

function renderOutlet() {
  const q = (document.getElementById('searchOutlet')?.value||'').toLowerCase();
  const oData = window.SD[window.SM]||{};
  const list = Object.entries(oData)
    .filter(([n])=>!q||n.toLowerCase().includes(q))
    .map(([n,ps])=>({n,qty:Object.values(ps).reduce((s,p)=>s+(p.qty||0),0),val:Object.values(ps).reduce((s,p)=>s+(p.val||0),0),sku:Object.keys(ps).length}))
    .sort((a,b)=>b.val-a.val);
  const el = document.getElementById('outletList');
  if (!el) return;
  if (!list.length) { el.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">Tidak ada data</div>'; return; }
  const max = list[0]?.val||1;
  el.innerHTML = list.map((o,i)=>
    '<div class="card" style="padding:12px 14px;">' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
    '<div class="list-rank '+rnkClass(i)+'" style="width:auto">#'+(i+1)+'</div>' +
    '<div style="flex:1;font-weight:600;font-size:13px">'+o.n+'</div>' +
    '<span style="font-size:11px;color:var(--accent);border:1px solid var(--border);border-radius:12px;padding:2px 8px">'+o.sku+' SKU</span>' +
    '</div>' +
    '<div style="display:flex;gap:16px;">' +
    '<div><div class="stat-label">Nilai</div><div style="font-family:Space Mono;font-size:13px;color:var(--accent)">'+fmtRp(o.val)+'</div></div>' +
    '<div><div class="stat-label">Qty</div><div style="font-family:Space Mono;font-size:13px;color:var(--green)">'+o.qty+' unit</div></div>' +
    '</div>' +
    '<div class="prog-bar"><div class="prog-fill" style="width:'+Math.min(100,(o.val/max)*100)+'%"></div></div>' +
    '</div>'
  ).join('');
}

function renderProduk() {
  const q = (document.getElementById('searchProduk')?.value||'').toLowerCase();
  const pData = window.PD[window.SM]||{};
  const oData = window.SD[window.SM]||{};
  const pMap = Object.keys(pData).length ? pData : {};
  if (!Object.keys(pMap).length) {
    Object.values(oData).forEach(ps=>Object.entries(ps).forEach(([p,v])=>{
      if(!pMap[p]) pMap[p]={qty:0,val:0};
      pMap[p].qty+=v.qty||0; pMap[p].val+=v.val||0;
    }));
  }
  const list = Object.entries(pMap).filter(([n])=>!q||n.toLowerCase().includes(q)).sort((a,b)=>b[1].val-a[1].val);
  const el = document.getElementById('produkList');
  if (!el) return;
  if (!list.length) { el.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">Tidak ada data</div>'; return; }
  const max = list[0]?.[1]?.val||1;
  el.innerHTML = list.map(([n,v],i)=>
    '<div class="card" style="padding:12px 14px;">' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
    '<div class="list-rank '+rnkClass(i)+'" style="width:auto">#'+(i+1)+'</div>' +
    '<div style="flex:1;font-weight:600;font-size:12px">'+n+'</div>' +
    '</div>' +
    '<div style="display:flex;gap:16px;">' +
    '<div><div class="stat-label">Nilai</div><div style="font-family:Space Mono;font-size:13px;color:var(--accent)">'+fmtRp(v.val)+'</div></div>' +
    '<div><div class="stat-label">Qty</div><div style="font-family:Space Mono;font-size:13px;color:var(--green)">'+v.qty+' unit</div></div>' +
    '</div>' +
    '<div class="prog-bar"><div class="prog-fill" style="width:'+Math.min(100,(v.val/max)*100)+'%"></div></div>' +
    '</div>'
  ).join('');
}

// ===== AI CHAT =====
window.doSend = async function() {
  const inp = document.getElementById('chatInp');
  const msg = (inp?.value||'').trim();
  if (!msg) return;
  inp.value = '';

  addMsg('user', msg);
  window.CH.push({role:'user', content:msg});

  const typEl = addTyping();

  try {
    const ctx = buildCtx(msg);
    const sysPr = `Kamu adalah AI Sales Assistant data penjualan Lalo YTD.
ATURAN: HANYA gunakan data di bawah. JANGAN berasumsi. Jika tidak ada datanya, katakan "Data tidak tersedia".
Jawab Bahasa Indonesia, singkat dan akurat. Gunakan angka PERSIS dari data.

DATA PENJUALAN:
${ctx}`;

    const msgs = [{role:'system',content:sysPr}, ...window.CH];
    const res = await fetch(GROQ_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:msgs,max_tokens:1500,temperature:0.3})
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const reply = data.choices?.[0]?.message?.content || 'Tidak ada jawaban.';
    typEl.remove();
    addMsg('ai', reply);
    window.CH.push({role:'assistant',content:reply});
    if (window.CH.length > 20) window.CH = window.CH.slice(-20);
  } catch(err) {
    typEl.remove();
    addMsg('ai', '❌ Error: ' + err.message);
  }
}

function buildCtx(q) {
  const qLow = (q||'').toLowerCase();
  const lines = [];
  window.AM.forEach(period => {
    const oD = window.SD[period]||{};
    const pD = window.PD[period]||{};
    const meta = window.YM[period]||{};
    const bulan = (meta.months||[]).map(m=>BULAN[m]||m).join(', ');
    let tV=0, tQ=0;
    const oMap={};
    Object.entries(oD).forEach(([n,ps])=>{
      let oV=0,oQ=0;
      Object.entries(ps).forEach(([,v])=>{tV+=v.val||0;tQ+=v.qty||0;oV+=v.val||0;oQ+=v.qty||0;});
      oMap[n]={val:oV,qty:oQ};
    });
    const fp = Object.keys(pD).length ? pD : {};
    if(Object.keys(fp).length){tV=Object.values(fp).reduce((s,p)=>s+(p.val||0),0);tQ=Object.values(fp).reduce((s,p)=>s+(p.qty||0),0);}

    lines.push(`=== ${period} (${bulan}) ===`);
    lines.push(`Total: ${Object.keys(oD).length} outlet, qty=${tQ}, val=${tV}`);

    // Filter relevant outlets
    const relO = Object.entries(oMap).filter(([n])=>{
      if(!qLow) return true;
      return qLow.split(/\s+/).some(w=>w.length>2&&n.toLowerCase().includes(w));
    });
    if (relO.length && relO.length<=15) {
      lines.push('OUTLET:');
      relO.forEach(([n,v])=>{
        lines.push(`  ${n}: qty=${v.qty}, val=${v.val}`);
        // Add product detail if single outlet
        if (relO.length<=3 && oD[n]) {
          Object.entries(oD[n]).forEach(([p,pv])=>lines.push(`    -${p}: qty=${pv.qty||0}, val=${pv.val||0}`));
        }
      });
    } else {
      lines.push('TOP 15 OUTLET:');
      Object.entries(oMap).sort((a,b)=>b[1].val-a[1].val).slice(0,15)
        .forEach(([n,v])=>lines.push(`  ${n}: qty=${v.qty}, val=${v.val}`));
    }

    // Filter relevant products
    const relP = Object.entries(fp).filter(([n])=>{
      if(!qLow) return false;
      return qLow.split(/\s+/).some(w=>w.length>2&&n.toLowerCase().includes(w));
    });
    if (relP.length) {
      lines.push('PRODUK RELEVAN:');
      relP.forEach(([n,v])=>lines.push(`  ${n}: qty=${v.qty||0}, val=${v.val||0}`));
    } else if (Object.keys(fp).length) {
      lines.push('TOP 20 PRODUK:');
      Object.entries(fp).sort((a,b)=>b[1].val-a[1].val).slice(0,20)
        .forEach(([n,v])=>lines.push(`  ${n}: qty=${v.qty||0}, val=${v.val||0}`));
    }
  });
  return lines.join('\n').slice(0,18000);
}

function addMsg(role, txt) {
  const el = document.getElementById('chatMsgs');
  if (!el) return;
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const safe = String(txt).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  d.innerHTML = '<div class="msg-lbl">'+(role==='user'?'KAMU':'AI ASSISTANT')+'</div><div class="msg-bubble">'+safe+'</div>';
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  return d;
}

function addTyping() {
  const el = document.getElementById('chatMsgs');
  if (!el) return {remove:()=>{}};
  const d = document.createElement('div');
  d.className = 'msg ai';
  d.innerHTML = '<div class="msg-lbl">AI ASSISTANT</div><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  return d;
}

// ===== HELPERS =====
window.selMonth = function(m) { window.SM=m; renderAll(); }
window.renderOutlet = renderOutlet;
window.renderProduk = renderProduk;
window.quickSend = function(btn) {
  const inp = document.getElementById('chatInp');
  if (inp) inp.value = btn.textContent.trim();
  switchTab('ai');
  setTimeout(() => window.doSend(), 150);
}
window.doForceReload = function() {
  try { localStorage.removeItem(CACHE_KEY); } catch(e) {}
  window.SD={}; window.PD={}; window.YM={}; window.AM=[]; window.SM=null;
  toast('🔄 Memuat ulang dari Firebase...');
  setTimeout(() => loadData(true), 300);
}

function fmtRp(v) {
  if (v>=1000000000) return 'Rp'+(v/1000000000).toFixed(1)+'M';
  if (v>=1000000) return 'Rp'+(v/1000000).toFixed(1)+'jt';
  if (v>=1000) return 'Rp'+(v/1000).toFixed(0)+'rb';
  return 'Rp'+v;
}

function rnkClass(i) { return i===0?'gold':i===1?'silver':i===2?'bronze':''; }

// Start
loadData(false);
</script>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['dashboard','outlet','produk','ai'][i] === name);
  });
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === 'page-' + name);
  });
}
</script>
