<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Monthly</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:12px;}
.ok{color:#0f0;}.err{color:#f44;}.info{color:#ff0;}.data{color:#0ff;}
pre{background:#222;padding:10px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
button{background:#0f0;color:#000;border:none;padding:8px 16px;margin:4px;border-radius:4px;font-size:13px;cursor:pointer;font-family:monospace;}
h3{color:#0f0;margin:10px 0 4px;}
</style>
</head>
<body>
<h3>🔍 Debug Monthly Subcollection</h3>
<button onclick="runDebug()">▶ Run Debug</button>
<button onclick="document.getElementById('log').innerHTML=''">Clear</button>
<div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyBwK90APc4xFmX7sOS8WoLyRDjIVThimqQ",
  authDomain:"lalo-ytd.firebaseapp.com",
  projectId:"lalo-ytd",
  storageBucket:"lalo-ytd.firebasestorage.app",
  messagingSenderId:"842696950491",
  appId:"1:842696950491:web:fd500db5cc5d2ed85182fe"
});
const db = getFirestore(app);

function log(msg, type='ok') {
  document.getElementById('log').innerHTML += `<div class="${type}">${msg}</div>`;
}

window.runDebug = async function() {
  document.getElementById('log').innerHTML = '';
  log('=== START DEBUG MONTHLY ===', 'info');

  try {
    // 1. Check sales_data monthly
    log('\n📂 sales_data...', 'info');
    const sdSnap = await getDocs(collection(db, 'sales_data'));
    log(`Found ${sdSnap.size} docs`);

    for (const doc of sdSnap.docs) {
      log(`\n📄 ${doc.id}`, 'info');
      
      // Check monthly subcollection
      const monthlySnap = await getDocs(collection(db, 'sales_data', doc.id, 'monthly'));
      log(`  monthly docs: ${monthlySnap.size} → [${monthlySnap.docs.map(d=>d.id).join(', ')}]`);
      
      if (monthlySnap.size > 0) {
        // Show m5 (Mei) if exists
        const m5 = monthlySnap.docs.find(d => d.id.startsWith('m5'));
        if (m5) {
          log(`\n  📦 ${m5.id} (Mei):`, 'info');
          const data = m5.data();
          const keys = Object.keys(data);
          log(`  Total outlets: ${keys.length}`);
          
          // Find Mimi
          const mimiKey = keys.find(k => k.toLowerCase().includes('mimi'));
          if (mimiKey) {
            log(`\n  ✅ MIMI FOUND: "${mimiKey}"`, 'ok');
            log(`<pre>${JSON.stringify(data[mimiKey], null, 2).slice(0, 800)}</pre>`);
          } else {
            log(`  ❌ No Mimi outlet in m5`, 'err');
            log(`  Sample outlets: ${keys.slice(0,5).join(', ')}`);
          }
        } else {
          log(`  ⚠️ No m5 doc found`, 'err');
          log(`  Available: ${monthlySnap.docs.map(d=>d.id).join(', ')}`);
        }

        // Show first monthly doc as sample
        const first = monthlySnap.docs[0];
        log(`\n  Sample doc "${first.id}":`, 'info');
        const fdata = first.data();
        const fkeys = Object.keys(fdata);
        log(`  Outlets: ${fkeys.length}`);
        log(`  First outlet: "${fkeys[0]}"`);
        if (fkeys[0]) {
          log(`<pre>${JSON.stringify(fdata[fkeys[0]], null, 2).slice(0,400)}</pre>`);
        }
      } else {
        log(`  ❌ monthly subcollection KOSONG atau tidak ada!`, 'err');
      }
    }

    // 2. Check sales_base monthly
    log('\n📂 sales_base...', 'info');
    const sbSnap = await getDocs(collection(db, 'sales_base'));
    for (const doc of sbSnap.docs) {
      log(`\n📄 ${doc.id}`, 'info');
      const monthlySnap = await getDocs(collection(db, 'sales_base', doc.id, 'monthly'));
      log(`  monthly docs: ${monthlySnap.size} → [${monthlySnap.docs.map(d=>d.id).join(', ')}]`);
    }

    log('\n=== DEBUG COMPLETE ===', 'info');

  } catch(err) {
    log(`ERROR: ${err.message}`, 'err');
    log(err.stack, 'err');
  }
}
</script>
</body>
</html>
